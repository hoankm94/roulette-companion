services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - SAVED_SESSIONS_DIR=/app/outputs/saved_sessions
    ports:
      - "8000:8000"
    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --no-access-log

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://api:8000
    depends_on:
      - api

  # Build the Edge Companion without installing Node on the host.
  # Load unpacked still requires Edge on the host.
  extension:
    build:
      context: ./extension
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./extension:/app
      - extension_node_modules:/app/node_modules
    profiles:
      - tools

volumes:
  frontend_node_modules:
  extension_node_modules:
